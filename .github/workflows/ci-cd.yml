name: CI/CD

on:
  pull_request:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FRONTEND_DIR: front/admin
  RUST_TEST_THREADS: "4"

jobs:
  security:
    name: Security and dependency policy checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny

      - name: Run cargo-deny security and policy checks
        run: cargo deny --locked check advisories bans licenses sources

  validate:
    name: Validate workspace and build artifacts
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oidc_smoke
          POSTGRES_PASSWORD: runtime-smoke-only
          POSTGRES_DB: oidc_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oidc_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: rustfmt, clippy
          toolchain: "1.96.0"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front/admin/package-lock.json

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Install frontend dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      - name: Build minified frontend assets
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run build

      - name: Check Rust with strict Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run Rust unit tests
        run: cargo test --locked --workspace --exclude integration-tests

      - name: Test patched cryptographic dependencies
        run: |
          cargo test --locked --manifest-path patches/passkey-auth/Cargo.toml --lib --tests
          cargo test --locked --manifest-path patches/saml/Cargo.toml --lib

      - name: Build release WASM artifacts
        run: |
          cargo build --locked -p oidc-admin-wasi --target wasm32-wasip2 --release
          cargo build --locked -p openid-connect-wasi --target wasm32-wasip2 --release

      - name: Check WASI Rust with strict Clippy
        run: cargo clippy --locked -p openid-connect-wasi -p oidc-admin-wasi -p oidc-wasi-http --target wasm32-wasip2 --lib --examples -- -D warnings

      - name: Install Wasmtime 48.0.1
        run: |
          curl -fsSL https://github.com/bytecodealliance/wasmtime/releases/download/v48.0.1/wasmtime-v48.0.1-x86_64-linux.tar.xz -o /tmp/wasmtime.tar.xz
          echo "4c2e31b68ad99e0a519f225a261fda099eb15f056d4a24fdb3c2a46517bde1df  /tmp/wasmtime.tar.xz" | sha256sum --check
          tar -xJf /tmp/wasmtime.tar.xz -C /tmp
          echo "/tmp/wasmtime-v48.0.1-x86_64-linux" >> "$GITHUB_PATH"

      - name: Verify WASI P3 HTTP and PostgreSQL at runtime
        env:
          OIDC_DATABASE_URL: postgresql://oidc_smoke:runtime-smoke-only@127.0.0.1:5432/oidc_smoke?sslmode=disable
        run: |
          cargo build --locked -p oidc-wasi-http --example http-client-smoke --target wasm32-wasip2 --release
          cargo run --locked -p oidc-wasm-dev -- runtime-test --skip-build

      - name: Upload frontend package
        uses: actions/upload-artifact@v7
        with:
          name: admin-frontend-dist
          path: front/admin/dist
          if-no-files-found: error

      - name: Upload frontend WASM package
        uses: actions/upload-artifact@v7
        with:
          name: oidc-admin-wasi-wasm
          path: target/wasm32-wasip2/release/oidc_admin_wasi.wasm
          if-no-files-found: error

      - name: Upload backend WASM package
        uses: actions/upload-artifact@v7
        with:
          name: openid-connect-wasi-wasm
          path: target/wasm32-wasip2/release/openid_connect_wasi.wasm
          if-no-files-found: error

  release_bundle:
    name: Package release bundle
    needs:
      - security
      - validate
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PACKAGE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('manual-{0}', github.run_number) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          toolchain: "1.96.0"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front/admin/package-lock.json

      - name: Build packaged release bundle
        run: bash scripts/package-release.sh --version "${PACKAGE_VERSION}"

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: openid-connect-wasi-release-bundle
          path: dist/packages
          if-no-files-found: error

      - name: Upload standalone release WASM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: openid-connect-wasi-release-wasm
          path: |
            target/wasm32-wasip2/release/oidc_admin_wasi.wasm
            target/wasm32-wasip2/release/openid_connect_wasi.wasm
          if-no-files-found: error

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/packages/openid-connect-wasi-${{ env.PACKAGE_VERSION }}.tar.gz
            target/wasm32-wasip2/release/oidc_admin_wasi.wasm
            target/wasm32-wasip2/release/openid_connect_wasi.wasm
