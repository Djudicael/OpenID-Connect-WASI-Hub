[build]
# Default to native target for dev/tests.
# Use --target wasm32-wasip2 for WASI builds.

[target.wasm32-wasip2]
# HTTP cdylib components are started explicitly with `wasmtime serve` (README).
runner = "wasmtime run -W component-model-async=y -S p3=y -S cli=y -S inherit-network=y -S inherit-env=y -S tcp=y -S allow-ip-name-lookup=y"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
